# Orbik, self-hosted: `docker compose up` from a fresh clone, then open http://localhost:8080.
#
# The first start builds the three images (several minutes), creates the database and prints a
# one-time setup link in the API's log:
#
#   docker compose logs api
#
# Open the link it prints (http://localhost:8080/setup?key=…, the code already filled in) and
# create the first account. See
# docs/self-hosting/ for AI keys, a domain with HTTPS, email, backups and upgrades.
#
# Settings come from a `.env` file beside this one (copy .env.example). The OpenAI key is needed
# for search (the embeddings); with it, and optionally an Anthropic key, the app writes the
# knowledge base and answers questions. Without any key it still crawls, keeps a word-for-word copy
# of every page and runs the agents that need no model.

name: orbik

x-server-environment: &server-environment
  NODE_ENV: production
  MONGODB_URI: mongodb://mongo:27017/orbik
  QDRANT_URL: http://qdrant:6333
  ORBIK_ANTHROPIC_API_KEY: ${ORBIK_ANTHROPIC_API_KEY:-}
  ORBIK_OPENAI_API_KEY: ${ORBIK_OPENAI_API_KEY:-}
  ORBIK_AI_PROVIDER: ${ORBIK_AI_PROVIDER:-}
  ORBIK_TELEMETRY: ${ORBIK_TELEMETRY:-off}
  ORBIK_CRAWLER_CONTACT_URL: ${ORBIK_CRAWLER_CONTACT_URL:-}
  ORBIK_EXTENSIONS: ${ORBIK_EXTENSIONS:-}

services:
  proxy:
    image: caddy:2.10.2
    restart: unless-stopped
    # Published on this machine only, unless ORBIK_BIND_ADDRESS opens them (0.0.0.0 for a server).
    ports:
      - "${ORBIK_BIND_ADDRESS:-127.0.0.1}:${ORBIK_HTTP_PORT:-8080}:80"
      - "${ORBIK_BIND_ADDRESS:-127.0.0.1}:${ORBIK_HTTPS_PORT:-8443}:443"
    environment:
      ORBIK_SITE_ADDRESS: ${ORBIK_SITE_ADDRESS:-:80}
      # A proxy in front of this one, trusted to say the request's scheme and client address
      # (docs/self-hosting/https.md § "Behind another proxy"). Unset: none.
      ORBIK_TRUSTED_PROXIES: ${ORBIK_TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    # Named after the Compose project, so a second install on the same machine (its own
    # COMPOSE_PROJECT_NAME) builds images of its own instead of replacing this one's. These images
    # are built here and exist in no registry: `never` stops Compose looking for them on Docker Hub
    # first, which only prints "pull access denied" before it builds them anyway.
    image: ${COMPOSE_PROJECT_NAME:-orbik}-web:local
    pull_policy: never
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    image: ${COMPOSE_PROJECT_NAME:-orbik}-api:local
    pull_policy: never
    restart: unless-stopped
    environment:
      <<: *server-environment
      # Inside its container, behind the proxy on the compose network.
      HOST: 0.0.0.0
      ALLOW_NON_LOOPBACK_HOST: "true"
      PORT: "4100"
      TRUST_PROXY: loopback,uniquelocal
      # The address people and AI clients reach this install at. The web app and the API share it.
      # Unset, it follows ORBIK_HTTP_PORT, so moving the port alone keeps the setup link, invite
      # links and the sign-in checks pointing at the address the install is really on.
      FRONTEND_ORIGINS: ${ORBIK_URL:-http://localhost:${ORBIK_HTTP_PORT:-8080}}
      PUBLIC_API_URL: ${ORBIK_URL:-http://localhost:${ORBIK_HTTP_PORT:-8080}}
      # The session and asset-link secrets are generated on first start and kept in the database,
      # unless set here.
      ORBIK_GENERATE_SECRETS: "true"
      SESSION_SECRET: ${SESSION_SECRET:-}
      ORBIK_ASSET_URL_SECRET: ${ORBIK_ASSET_URL_SECRET:-}
      ORBIK_SIGNUP: ${ORBIK_SIGNUP:-closed}
      ORBIK_SIGNUP_VERIFY_EMAIL: ${ORBIK_SIGNUP_VERIFY_EMAIL:-false}
      ORBIK_ADMIN_EMAILS: ${ORBIK_ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: agents
    image: ${COMPOSE_PROJECT_NAME:-orbik}-agents:local
    pull_policy: never
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    environment:
      <<: *server-environment
    # Chromium renders pages for the Design system agent.
    shm_size: 512mb
    depends_on:
      mongo:
        condition: service_healthy
      api:
        condition: service_healthy

  scheduler:
    image: ${COMPOSE_PROJECT_NAME:-orbik}-agents:local
    pull_policy: never
    restart: unless-stopped
    command: ["node", "src/scheduler.js"]
    environment:
      <<: *server-environment
    depends_on:
      worker:
        condition: service_started

  mongo:
    image: mongo:7.0.45
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      # Qdrant reports its own anonymous telemetry unless told not to. An install sends nothing
      # anywhere unless ORBIK_TELEMETRY says so, and that includes the services it bundles.
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mongo-data:
  qdrant-data:
  caddy-data:
