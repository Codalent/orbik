# Asks everyone who opens a pull request to sign the Contributor License Agreement (CLA.md) once,
# by replying with the sentence below. Signatures are kept in signatures/cla.json on the
# cla-signatures branch, so signing never adds commits to main.
#
# pull_request_target runs with write access for pull requests from forks. That is safe here only
# because this job never checks out or runs the pull request's code: keep it that way.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the Orbik CLA and I hereby sign it.'))
    steps:
      - name: Check signatures
        # contributor-assistant/github-action v2.6.1, pinned by commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Codalent/orbik/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # Codalent's own people are covered by their employment; add each one's GitHub login.
          allowlist: arpban,*[bot]
          custom-pr-sign-comment: I have read the Orbik CLA and I hereby sign it.
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be merged, please read the
            [Orbik Contributor License Agreement](https://github.com/Codalent/orbik/blob/main/CLA.md)
            and sign it by replying to this pull request with the sentence below. You sign once,
            and it covers every pull request after.
          custom-allsigned-prcomment: Everyone on this pull request has signed the Orbik CLA. Thank you.
          signed-commit-message: "$contributorName signed the Orbik CLA in $owner/$repo#$pullRequestNo"
          create-file-commit-message: Start the record of Orbik CLA signatures
